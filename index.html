<script>
// --- Minimal QR encoder (byte mode, error correction level L, versions 1-5) ---
const QR_LEVELS={1:{total:26,ecc:7,data:19,align:[]},2:{total:44,ecc:10,data:34,align:[6,18]},3:{total:70,ecc:15,data:55,align:[6,22]},4:{total:100,ecc:20,data:80,align:[6,26]},5:{total:134,ecc:26,data:108,align:[6,30]}};
function qrGfMul(a,b){let r=0;for(let i=0;i<8;i++){if(b&1)r^=a;const hi=a&0x80;a=(a<<1)&0xff;if(hi)a^=0x1d;b>>=1}return r}
function qrGenerator(n){let poly=[1];for(let i=0;i<n;i++){const next=new Array(poly.length+1).fill(0);for(let j=0;j<poly.length;j++){next[j]^=poly[j];next[j+1]^=qrGfMul(poly[j],1)}poly=next}return poly}
function qrRemainder(data,gen){const res=new Array(gen.length).fill(0);for(const byte of data){const factor=byte^res.shift();res.push(0);for(let i=0;i<gen.length-1;i++)res[i]^=qrGfMul(gen[i],factor)}return res}
function qrEncode(text){
 const bytes=[];for(let i=0;i<text.length;i++){const c=text.codePointAt(i);if(c>255)throw new Error('qr: not byte mode');bytes.push(c)}
 const need=bytes.length+2;let version=1;for(let v=1;v<=5;v++){if(QR_LEVELS[v].data>=need){version=v;break}}
 const L=QR_LEVELS[version],size=17+version*4;
 const modules=[],reserved=[];for(let i=0;i<size;i++){modules.push(new Array(size).fill(null));reserved.push(new Array(size).fill(false))}
 const bits=[];const push=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1)};
 push(4,4);push(bytes.length,8);bytes.forEach(b=>push(b,8));
 const capacity=L.data*8;for(let i=0;i<4&&bits.length<capacity;i++)bits.push(0);
 while(bits.length%8)bits.push(0);
 const codewords=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];codewords.push(b)}
 const pads=[0xec,0x11];let p=0;while(codewords.length<L.data)codewords.push(pads[p++%2]);
 const gen=qrGenerator(L.ecc),ecc=qrRemainder(codewords,gen),all=codewords.concat(ecc);

 const put=(r,c,v)=>{if(r<0||c<0||r>=size||c>=size)return;modules[r][c]=v?1:0;reserved[r][c]=true};
 for(let i=0;i<size;i++){put(6,i,i%2===0);put(i,6,i%2===0)}
 [[0,0],[0,size-7],[size-7,0]].forEach(([r,c])=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=size||cc>=size)continue;const inFinder=dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4));put(rr,cc,inFinder)}});
 L.align.forEach(ar=>L.align.forEach(ac=>{const nearFinder=(ar<=8&&ac<=8)||(ar<=8&&ac>=size-9)||(ar>=size-9&&ac<=8);if(nearFinder)return;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const dark=Math.max(Math.abs(dr),Math.abs(dc))!==1;put(ar+dr,ac+dc,dark)}}));
 put(size-8,8,1);
 // reserve format information positions (both copies) before placing data
 const fmtReserve=(r,c)=>{if(r>=0&&c>=0&&r<size&&c<size)reserved[r][c]=true};
 for(let i=0;i<=5;i++)fmtReserve(8,i);fmtReserve(8,7);fmtReserve(8,8);fmtReserve(7,8);for(let i=9;i<=14;i++)fmtReserve(14-i,8);
 for(let i=0;i<=6;i++)fmtReserve(size-1-i,8);for(let i=7;i<=14;i++)fmtReserve(8,size-15+i);
 // place data bits: two-module columns, right to left, alternating direction, skipping column 6
 let bitIndex=7,byteIndex=0,inc=-1,row=size-1;
 for(let col=size-1;col>0;col-=2){
  if(col===6)col=5;
  while(true){
   for(let k=0;k<2;k++){
    const c=col-k;if(reserved[row][c])continue;

const hasIDB=()=>typeof indexedDB!=='undefined';

async function packPut(key,blob){if(!hasIDB())return false;try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').put(blob,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch{return false}}
async function packKeys(){if(!hasIDB())return[];try{const db=await idb();return await new Promise((res,rej)=>{const rq=db.transaction('clips','readonly').objectStore('clips').getAllKeys();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)})}catch{return[]}}
async function packDelete(keys){if(!hasIDB()||!keys.length)return;try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');const st=tx.objectStore('clips');keys.forEach(k=>st.delete(k));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch{}}

function drawWheel(){const canvas=$('#wheel'),ctx=canvas.getContext('2d'),n=sectors().length,a=2*Math.PI/n;ctx.clearRect(0,0,600,600);sectors().forEach((v,i)=>{const start=-Math.PI/2+i*a;ctx.beginPath();ctx.moveTo(300,300);ctx.arc(300,300,292,start,start+a);ctx.closePath();ctx.fillStyle=typeof v==='string'?(v==='bankrupt'?'#202032':v==='prize'?'#c2762a':'#b94578'):['#8060cf','#4a9989','#b87d3c','#6c61b4'][i%4];ctx.fill();ctx.strokeStyle='#eedcff66';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(300,300);ctx.rotate(start+a/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font=typeof v==='string'?'bold '+Math.max(13,Math.round(240/n))+'px Arial':'bold '+Math.max(20,Math.round(340/n))+'px Arial';ctx.fillText(typeof v==='string'?wt(v):v,262,0);ctx.restore()});for(let i=0;i<n*2;i++){const angle=i*Math.PI/n;ctx.beginPath();ctx.arc(300+286*Math.cos(angle),300+286*Math.sin(angle),3,0,Math.PI*2);ctx.fillStyle='#ffe4a1';ctx.fill()}}
function renderWheelUI(){if(!$('#spin'))return;$('#wheelTitle').textContent=wt('wheel');$('#wheelDesc').textContent=wt('desc');$('#wheelRules').textContent=wt('rules');$('#spin').textContent=wt(spinning?'spinning':'spin');$('#spin').disabled=spinning||finished||stake!==null||(superStage()&&superSpins<=0);$('#wheelStatus').textContent=spinning?wt('spinning'):wheelMessage||(stake!==null?stake+wt('pick'):(superStage()?t('spinsLeft')+': '+superSpins+' · ':'')+wt('ready')+players[activePlayer].name);const board=$('#scoreboard');board.replaceChildren();players.forEach((p,i)=>{const card=document.createElement('div');card.className='player-card'+(i===activePlayer?' active':'');const button=document.createElement('button');button.className='name-edit';button.title=wt('rename');const name=document.createElement('span');name.textContent=p.name+(Party.active&&Party.role==='host'&&Party.isRemote(i)?' 📱':'')+' ✎';button.append(name);button.onclick=()=>{if(spinning)return;const value=prompt(wt('rename'),p.name);if(value!==null){p.name=value.trim().slice(0,24)||wt('player')+' '+(i+1);savePlayers();renderWheelUI();renderLobby()}};const score=document.createElement('b');score.textContent=p.score;card.append(button,score);board.append(card)});drawWheel();if(Party.active&&Party.role==='host')Party.sync()}
function spinWheel(){if(spinning||finished||screen!=='game'||stake!==null)return;if(superStage()&&superSpins<=0)return;if(Party.active&&Party.role==='host'&&Party.isRemote(activePlayer))return;spinning=true;if(superStage())superSpins--;wheelMessage='';renderGame();renderWheelUI();tone('click');voicePlay('spin');const list=sectors(),chosen=Math.floor(Math.random()*list.length),target=360-(chosen+.5)*360/list.length;const delta=(target-rotation%360+360)%360;rotation+=360*5+delta;$('#wheel').style.transform='rotate('+rotation+'deg)';let ticks=0;spinTick=setInterval(()=>{ticks++;tickSound();if(ticks>34)clearInterval(spinTick)},110);let done=false;const settle=()=>{if(done)return;done=true;$('#wheel').removeEventListener('transitionend',settle);spinning=false;const value=list[chosen];if(value==='bankrupt'){players[activePlayer].score=0;players[activePlayer].round=0;wheelMessage=wt('bankMsg');advanceTurn();wheelMessage+=' '+wt('ready')+players[activePlayer].name;tone('bankrupt')}else if(value==='skip'){advanceTurn();wheelMessage=wt('skipMsg')+' '+wt('ready')+players[activePlayer].name;tone('bad')}else if(value==='prize'){players[activePlayer].score+=500;players[activePlayer].total+=500;wheelMessage=wt('prizeMsg');advanceTurn();wheelMessage+=' '+wt('ready')+players[activePlayer].name;tone('prize')}else{stake=value;tone('good')}renderGame();renderWheelUI();if(superStage()&&stake===null){endRound(false);return}if(settings.timer&&!timerId&&stake!==null)startTimer(settings.seconds)};$('#wheel').addEventListener('transitionend',settle,{once:true});setTimeout(settle,matchMedia('(prefers-reduced-motion: reduce)').matches?50:4000)}
$('#spin').onclick=spinWheel;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(!$('#result').classList.contains('hidden')){if(e.key==='Tab'){const buttons=[$('#resultNext'),$('#resultMenu')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[1].focus()}else if(!e.shiftKey&&document.activeElement===buttons[1]){e.preventDefault();buttons[0].focus()}}if(e.key==='Escape'){show('home')}return}if(!$('#answer').classList.contains('hidden')){if(e.key==='Escape')$('#answer').classList.add('hidden');return}if(!$('#achievements').classList.contains('hidden')){if(e.key==='Escape')$('#achievements').classList.add('hidden');return}if(e.key.length===1)guess(e.key.toUpperCase())});
// ---------- Screen mode: host + phone players over QR ----------
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('peerjs'));document.head.append(s)})}
function partyCode(){let s='';const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function partyURL(code){return location.href.split('#')[0]+'#t='+code}
function drawQR(canvas,text){try{const q=qrEncode(text);const ctx=canvas.getContext('2d');const scale=Math.max(2,Math.floor(canvas.width/q.size));const off=Math.floor((canvas.width-scale*q.size)/2);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#1b1636';for(let r=0;r<q.size;r++)for(let c=0;c<q.size;c++)if(q.modules[r][c])ctx.fillRect(off+c*scale,off+r*scale,scale,scale);return true}catch(e){return false}}
async function verifyQR(canvas,text){if(!('BarcodeDetector' in window))return true;try{const res=await new window.BarcodeDetector({formats:['qr_code']}).detect(canvas);return !!res.length&&res[0].rawValue===text}catch{return true}}


const Party={
 active:false,role:null,code:'',transport:'local',clients:[],spectators:[],spectator:false,tally:{},players:[],myId:'c'+Math.random().toString(36).slice(2,8),bc:null,peer:null,conns:new Map(),state:null,
 isRemote(i){return this.role==='host'&&i>0},
 async open(){
this.role='host';this.active=true;this.code=partyCode();this.clients=[];this.spectators=[];this.tally={};this.spectator=false;
  const url=partyURL(this.code);show('party');$('#partyCode').textContent=this.code;$('#partyUrl').textContent=url;
  const ok=location.protocol==='file:'?false:drawQR($('#qr'),url);
  $('#qr').classList.toggle('hidden',!ok);$('#partyQrFail').classList.toggle('hidden',ok);
  $('#partyFileWarn').classList.toggle('hidden',location.protocol!=='file:');
  this.hostStatus(t('connecting'));await this.connect();this.renderHost();const rl=$('#partyReactions');if(rl)rl.classList.remove('hidden');
 },
 async connect(){
  this.disconnect();
  if(this.transport==='lan'){
   try{await loadPeer()}catch(e){toast(t('netFail'));this.transport='local';this.syncTransportUI()}
  }
  if(this.transport==='lan'&&typeof window.Peer==='function'){
   const id='polechudes-'+this.code;
   try{this.peer=new window.Peer(id,{debug:0})}catch(e){toast(t('netFail'));return}
   this.peer.on('open',()=>this.hostStatus(t('connected')+' · '+t('transportLan')));
   this.peer.on('error',()=>{toast(t('netFail'));this.hostStatus(t('disconnected'))});
   this.peer.on('connection',conn=>{conn.on('open',()=>this.conns.set(conn.peer,conn));conn.on('data',m=>this.onMessage(m,conn.peer));conn.on('close',()=>this.drop(conn.peer))});
  }else{
   if(typeof BroadcastChannel==='undefined'){toast(t('netFail'));return}
   this.bc=new BroadcastChannel('pole-chudes-'+this.code);
   this.bc.onmessage=e=>this.onMessage(e.data,e.data.from);
   this.hostStatus(t('connected')+' · '+t('transportLocal'));
  }
 },
 syncTransportUI(){$$('input[name=ptrans]').forEach(r=>{r.checked=r.value===this.transport})},
 disconnect(){if(this.bc){try{this.bc.close()}catch{};this.bc=null}if(this.peer){try{this.peer.destroy()}catch{};this.peer=null}this.conns.clear()},
 send(msg,to){msg.from=this.role==='host'?'HOST':this.myId;if(to)msg.to=to;if(this.bc){try{this.bc.postMessage(msg)}catch{}}else if(to&&this.conns.has(to)){try{this.conns.get(to).send(msg)}catch{}}else if(!to){this.conns.forEach(c=>{try{c.send(msg)}catch{}})}},
 hostStatus(text){const el=$('#partyStatus');if(el)el.textContent=text},
 renderHost(){
  const list=$('#partyPlayers');if(!list)return;list.replaceChildren();
  this.players.forEach((p,i)=>{const row=document.createElement('div');row.className='party-player';const n=document.createElement('b');n.textContent=(this.isRemote(i)?'📱 ':'🖥 ')+p.name;row.append(n);list.append(row)});
  const add=document.createElement('div');add.className='party-player';add.innerHTML='<small class="sub">'+t('players')+': '+this.players.length+'</small>';list.append(add);
  const sp=$('#partySpectators');if(sp){sp.replaceChildren();
   const head=document.createElement('h3');head.textContent=t('spectators')+': '+this.spectators.length;sp.append(head);
   if(!this.spectators.length){const e=document.createElement('div');e.className='empty';e.textContent=t('spectatorHint');sp.append(e)}
   else this.spectators.forEach(x=>{const row=document.createElement('div');row.className='party-player spectator';
    const n=document.createElement('b');n.textContent='👁 '+x.name;const v=document.createElement('span');v.textContent='💬 '+(this.tally[x.id]||0);
    row.append(n,v);sp.append(row)})}
 },
stop(){this.send({t:'bye'});this.disconnect();this.active=false;this.role=null;this.clients=[];this.spectators=[];this.tally={};this.spectator=false;this.state=null;show('home');const rl=$('#partyReactions');if(rl)rl.classList.add('hidden');},
 showReaction(emoji,who){const layer=$('#partyReactions');if(!layer)return;const el=document.createElement('span');el.className='reaction-float';el.textContent=emoji;if(who)el.title=who;layer.append(el);setTimeout(()=>el.remove(),2600)},
 react(emoji){this.send({t:'react',e:emoji});if(this.role==='host')this.showReaction(emoji,'🖥 '+roster[0].name)},
 rebuildPlayers(){this.players=roster.slice(0,1).concat(this.clients.map(c=>({name:c.name,score:0,round:0,total:0})));if(this.players.length)playerCount=this.players.length},
 onMessage(msg,from){
  if(this.role!=='host'||!msg||!msg.t)return;
  if(msg.t==='hello'){
   if(msg.spectator){
    if(this.clients.some(c=>c.id===from)){this.clients=this.clients.filter(c=>c.id!==from);this.rebuildPlayers()}
    if(!this.spectators.some(c=>c.id===from))this.spectators.push({id:from,name:String(msg.name||'').slice(0,24)||(t('spectator')+' '+(this.spectators.length+1))});
    this.renderHost();this.send({t:'welcome',players:this.players.map(p=>p.name),spectators:this.spectators.map(x=>x.name),spectator:true},from);
    if(this.state)this.sync();
    return;
   }
   if(this.spectators.some(c=>c.id===from))this.spectators=this.spectators.filter(c=>c.id!==from);
   if(!this.clients.some(c=>c.id===from))this.clients.push({id:from,name:String(msg.name||'').slice(0,24)||(wt('player')+' '+(this.clients.length+2))});
this.rebuildPlayers();this.renderHost();this.send({t:'welcome',players:this.players.map(p=>p.name),spectators:this.spectators.map(x=>x.name)},from);
   if(this.state)this.sync();
   return;
  }
  if(msg.t==='react'){
   const who=this.spectators.find(x=>x.id===from);
   this.tally[from]=(this.tally[from]||0)+1;
   this.showReaction(String(msg.e||'👏').slice(0,4),(who?'👁 ':'📱 ')+(who?who.name:(this.clients.find(c=>c.id===from)||{name:'?'}).name));
   this.renderHost();return;
  }
  if(msg.t==='bye'){this.drop(from);return}
  const idx=this.clients.findIndex(c=>c.id===from);
  if(idx<0)return;
  const playerIndex=idx+1;
  if(playerIndex!==activePlayer||finished)return;
  if(msg.t==='letter')guess(msg.c);
  else if(msg.t==='spin')spinWheel();
  else if(msg.t==='word'){$('#answerInput').value=String(msg.w||'').slice(0,60);checkAnswer()}
 },
drop(id){this.clients=this.clients.filter(c=>c.id!==id);this.spectators=this.spectators.filter(c=>c.id!==id);delete this.tally[id];this.rebuildPlayers();this.renderHost();this.send({t:'welcome',players:this.players.map(p=>p.name),spectators:this.spectators.map(x=>x.name)})},
 sync(){
  if(this.role!=='host'||!current)return;
  const base={t:'state',stage:tour.stage,question:current.question,board:current.answer.split(' ').map(w=>[...w].map(c=>opened(c)?c:null)),players:this.players.map(p=>({name:p.name,score:p.score})),active:activePlayer,stake,spinning,finished,errors,spins:superStage()?superSpins:null,answer:finished?current.answer:null,spectators:this.spectators.map(x=>x.name),tally:Object.assign({},this.tally)};
  this.clients.forEach((c,i)=>this.send(Object.assign({},base,{you:i+1}),c.id));
  this.spectators.forEach(x=>this.send(Object.assign({},base,{you:-1,spectator:true}),x.id));
 },
 async join(code,name){
  this.role='client';this.active=true;this.code=code;this.spectators=[];this.tally={};this.spectator=false;
  show('client');$('#clientRoom').textContent=t('room')+': '+code;$('#clientName').value=name||'';
  $('#clientJoinArea').classList.remove('hidden');$('#clientWait').classList.add('hidden');$('#clientGame').classList.add('hidden');
  this.clientStatus(t('connecting'));
  this.transport=(typeof window.Peer==='function')?'lan':'local';
  if(this.transport==='lan'){try{await loadPeer()}catch(e){this.transport='local'}}
  this.disconnect();
  if(this.transport==='lan'&&typeof window.Peer==='function'){
   try{this.peer=new window.Peer(null,{debug:0})}catch(e){this.clientFail();return}
   this.peer.on('open',()=>{const conn=this.peer.connect('polechudes-'+code,{reliable:true});this.conns.set('HOST',conn);conn.on('open',()=>{this.hello();this.clientStatus(t('connected')+' · '+t('transportLan'))});conn.on('data',m=>this.onClient(m));conn.on('close',()=>this.clientFail())});
   this.peer.on('error',()=>this.clientFail());
  }else{
   if(typeof BroadcastChannel==='undefined'){this.clientFail();return}
   this.bc=new BroadcastChannel('pole-chudes-'+code);this.bc.onmessage=e=>{const m=e.data;if(m&&m.t&&(!m.to||m.to===this.myId))this.onClient(m)};
   this.hello();this.clientStatus(t('connected')+' · '+t('transportLocal'));
  }
 },
hello(){const box=$('#clientSpectator');this.spectator=!!(box&&box.checked);this.send({t:'hello',name:($('#clientName').value||'').trim().slice(0,24),spectator:this.spectator});if(this.spectator){$('#clientJoinArea').classList.add('hidden');$('#clientWait').classList.remove('hidden');this.clientStatus(t('spectatorMode'))}},
 clientStatus(s){const el=$('#clientStatus');if(el)el.textContent=s},
 clientFail(){this.clientStatus(t('netFail'));toast(t('netFail'))},
 onClient(m){
if(m.t==='welcome'){$('#clientJoinArea').classList.add('hidden');$('#clientWait').classList.remove('hidden');this.clientStatus(m.spectator?t('spectatorMode'):t('connected'));this.spectator=!!m.spectator;this.spectators=(m.spectators||[]).map(n=>({name:n}));this.renderReactions()}
  else if(m.t==='state'){this.state=m;$('#clientJoinArea').classList.add('hidden');$('#clientWait').classList.add('hidden');$('#clientGame').classList.remove('hidden');this.renderClient()}
 },
 renderClient(){
  const s=this.state;if(!s)return;
  $('#clientQuestion').textContent=s.question||'';
  const board=$('#clientBoard');board.replaceChildren();
  (s.board||[]).forEach(word=>{const g=document.createElement('div');g.className='word-group';word.forEach(c=>{const tile=document.createElement('span');tile.className='tile'+(c?' open':'');tile.textContent=c||'';g.append(tile)});board.append(g)});
  const myIndex=typeof s.you==='number'?s.you:-1;
  const myTurn=!s.finished&&!s.spinning&&s.active===myIndex&&myIndex>=0;
  $('#clientTurn').textContent=s.finished?(s.answer||''):s.spinning?wt('spinning'):myTurn?t('yourTurn'):t('notYourTurn');
  const spec=!!s.spectator;
  $('#clientTurn').textContent=s.finished?(s.answer||''):s.spinning?wt('spinning'):spec?t('youSpectator'):myTurn?t('yourTurn'):t('notYourTurn');
  $('#clientSpin').classList.toggle('hidden',spec||!myTurn||s.stake!==null);
  $('#clientSpin').disabled=spec||!myTurn||s.stake===null||s.spinning;
  $('#clientWord').classList.toggle('hidden',spec||!myTurn||s.stake===null);
  $('#clientWord').disabled=spec||!myTurn||s.stake===null;
  const alpha=alphabets[lang];const al=$('#clientAlphabet');al.replaceChildren();
  if(!spec)[...alpha].forEach(c=>{const b=document.createElement('button');b.className='letter';b.textContent=c;b.disabled=!myTurn||s.stake===null||s.spinning||s.finished;b.onclick=()=>{if(b.disabled)return;this.send({t:'letter',c});this.clientStatus(t('letterSent'))};al.append(b)});
  this.renderReactions();
  const sc=$('#clientScores');sc.replaceChildren();
  s.players.forEach((p,i)=>{const row=document.createElement('div');row.className='party-player'+(i===s.active?' active':'');const n=document.createElement('b');n.textContent=p.name;const v=document.createElement('span');v.textContent=p.score;row.append(n,v);sc.append(row)});
  if((s.stage==='super'||s.stage==='super2')&&s.spins!==null){const sp=document.createElement('div');sp.className='party-player';sp.innerHTML='<small class="sub">'+t('spinsLeft')+': '+s.spins+'</small>';sc.append(sp)}
 },
 renderReactions(){
  const bar=$('#clientReactions');if(!bar)return;
  bar.classList.toggle('hidden',!this.active);
  const rl=$('#partyReactions');if(rl)rl.classList.toggle('hidden',!(this.active&&this.role==='host'));
  if(!bar.dataset.built){bar.dataset.built='1';
   ['👏','🔥','😂','😮','💡','👍','🎉','🤔'].forEach(e=>{const b=document.createElement('button');b.type='button';b.className='react-btn';b.textContent=e;
    b.onclick=()=>{Party.react(e);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')};bar.append(b)})}
  const list=$('#clientSpectators');if(list){list.replaceChildren();
   const names=(this.state&&this.state.spectators)||this.spectators.map(x=>x.name);
   const head=document.createElement('h3');head.textContent=t('spectators')+': '+names.length;list.append(head);
   if(!names.length){const e=document.createElement('div');e.className='empty';e.textContent=t('spectatorHint');list.append(e)}
   else names.forEach(n=>{const row=document.createElement('div');row.className='party-player spectator';const b=document.createElement('b');b.textContent='👁 '+n;row.append(b);list.append(row)})}
 },
