<script>
// --- Minimal QR encoder (byte mode, error correction level L, versions 1-5) ---
const QR_LEVELS={1:{total:26,ecc:7,data:19,align:[]},2:{total:44,ecc:10,data:34,align:[6,18]},3:{total:70,ecc:15,data:55,align:[6,22]},4:{total:100,ecc:20,data:80,align:[6,26]},5:{total:134,ecc:26,data:108,align:[6,30]}};
function qrGfMul(a,b){let r=0;for(let i=0;i<8;i++){if(b&1)r^=a;const hi=a&0x80;a=(a<<1)&0xff;if(hi)a^=0x1d;b>>=1}return r}
function qrGenerator(n){let poly=[1];for(let i=0;i<n;i++){const next=new Array(poly.length+1).fill(0);for(let j=0;j<poly.length;j++){next[j]^=poly[j];next[j+1]^=qrGfMul(poly[j],1)}poly=next}return poly}
function qrRemainder(data,gen){const res=new Array(gen.length).fill(0);for(const byte of data){const factor=byte^res.shift();res.push(0);for(let i=0;i<gen.length-1;i++)res[i]^=qrGfMul(gen[i],factor)}return res}
function qrEncode(text){
 const bytes=[];for(let i=0;i<text.length;i++){const c=text.codePointAt(i);if(c>255)throw new Error('qr: not byte mode');bytes.push(c)}
 const need=bytes.length+2;let version=1;for(let v=1;v<=5;v++){if(QR_LEVELS[v].data>=need){version=v;break}}
 const L=QR_LEVELS[version],size=17+version*4;
 const modules=[],reserved=[];for(let i=0;i<size;i++){modules.push(new Array(size).fill(null));reserved.push(new Array(size).fill(false))}
 const bits=[];const push=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1)};
 push(4,4);push(bytes.length,8);bytes.forEach(b=>push(b,8));
 const capacity=L.data*8;for(let i=0;i<4&&bits.length<capacity;i++)bits.push(0);
 while(bits.length%8)bits.push(0);
 const codewords=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];codewords.push(b)}
 const pads=[0xec,0x11];let p=0;while(codewords.length<L.data)codewords.push(pads[p++%2]);
 const gen=qrGenerator(L.ecc),ecc=qrRemainder(codewords,gen),all=codewords.concat(ecc);

 const put=(r,c,v)=>{if(r<0||c<0||r>=size||c>=size)return;modules[r][c]=v?1:0;reserved[r][c]=true};
 for(let i=0;i<size;i++){put(6,i,i%2===0);put(i,6,i%2===0)}
 [[0,0],[0,size-7],[size-7,0]].forEach(([r,c])=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=size||cc>=size)continue;const inFinder=dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4));put(rr,cc,inFinder)}});
 L.align.forEach(ar=>L.align.forEach(ac=>{const nearFinder=(ar<=8&&ac<=8)||(ar<=8&&ac>=size-9)||(ar>=size-9&&ac<=8);if(nearFinder)return;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const dark=Math.max(Math.abs(dr),Math.abs(dc))!==1;put(ar+dr,ac+dc,dark)}}));
 put(size-8,8,1);
 // reserve format information positions (both copies) before placing data
 const fmtReserve=(r,c)=>{if(r>=0&&c>=0&&r<size&&c<size)reserved[r][c]=true};
 for(let i=0;i<=5;i++)fmtReserve(8,i);fmtReserve(8,7);fmtReserve(8,8);fmtReserve(7,8);for(let i=9;i<=14;i++)fmtReserve(14-i,8);
 for(let i=0;i<=6;i++)fmtReserve(size-1-i,8);for(let i=7;i<=14;i++)fmtReserve(8,size-15+i);
 // place data bits: two-module columns, right to left, alternating direction, skipping column 6
 let bitIndex=7,byteIndex=0,inc=-1,row=size-1;
 for(let col=size-1;col>0;col-=2){
  if(col===6)col=5;
  while(true){
   for(let k=0;k<2;k++){
    const c=col-k;if(reserved[row][c])continue;
    let dark=false;if(byteIndex<all.length)dark=((all[byteIndex]>>>bitIndex)&1)===1;
    modules[row][c]=dark?1:0;
    bitIndex--;if(bitIndex<0){byteIndex++;bitIndex=7}
   }
   row+=inc;if(row<0||row>=size){row-=inc;inc=-inc;break}
  }
 }
 const modules0=modules.map(r=>r.slice()); let best=null,bestPenalty=Infinity,bestMask=0;
 for(let mask=0;mask<8;mask++){
  const m=modules0.map(r=>r.slice());
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){if(reserved[r][c])continue;let dark=false;switch(mask){case 0:dark=(r+c)%2===0;break;case 1:dark=r%2===0;break;case 2:dark=c%3===0;break;case 3:dark=(r+c)%3===0;break;case 4:dark=(Math.floor(r/2)+Math.floor(c/3))%2===0;break;case 5:dark=(r*c)%2+(r*c)%3===0;break;case 6:dark=((r*c)%2+(r*c)%3)%2===0;break;default:dark=((r*c)%3+(r+c)%2)%2===0}m[r][c]^=dark?1:0}
  let penalty=0;
  for(let r=0;r<size;r++){let run=1;for(let c=1;c<size;c++){if(m[r][c]===m[r][c-1])run++;else{if(run>=5)penalty+=3+run-5;run=1}}if(run>=5)penalty+=3+run-5}
  for(let c=0;c<size;c++){let run=1;for(let r=1;r<size;r++){if(m[r][c]===m[r-1][c])run++;else{if(run>=5)penalty+=3+run-5;run=1}}if(run>=5)penalty+=3+run-5}
  for(let r=0;r<size-1;r++)for(let c=0;c<size-1;c++){const v=m[r][c];if(v===m[r][c+1]&&v===m[r+1][c]&&v===m[r+1][c+1])penalty+=3}
  const pat=[1,0,1,1,1,0,1,0,0,0,0];for(let r=0;r<size;r++)for(let c=0;c<=size-11;c++){let ok=true,ok2=true;for(let k=0;k<11;k++){if(m[r][c+k]!==pat[k])ok=false;if(m[r][c+k]!==pat[10-k])ok2=false}if(ok)penalty+=40;if(ok2)penalty+=40}
  for(let c=0;c<size;c++)for(let r=0;r<=size-11;r++){let ok=true,ok2=true;for(let k=0;k<11;k++){if(m[r+k][c]!==pat[k])ok=false;if(m[r+k][c]!==pat[10-k])ok2=false}if(ok)penalty+=40;if(ok2)penalty+=40}
  let dark=0;for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(m[r][c])dark++;
  penalty+=10*Math.floor(Math.abs(dark*100/(size*size)-50)/5);
  if(penalty<bestPenalty){bestPenalty=penalty;best=m;bestMask=mask}
 }
 const fmt=(1<<3|bestMask)<<10;let rem=fmt;for(let i=4;i>=0;i--){if(!((rem>>>(i+10))&1))continue;rem^=0x537<<i}
 const format=(fmt|rem)^0x5412;
 const place=(bit,r,c)=>{if(r<0||c<0||r>=size||c>=size)return;best[r][c]=(format>>>bit)&1};
 for(let i=0;i<=5;i++)place(i,8,i);place(6,8,7);place(7,8,8);place(8,7,8);for(let i=9;i<=14;i++)place(i,14-i,8);
 for(let i=0;i<=6;i++)place(i,size-1-i,8);for(let i=7;i<=14;i++)place(i,8,size-15+i);
 return {size,modules:best};
}
// Self-test: decode our own output and verify Reed-Solomon syndromes.
function qrSelfTest(){
 const samples=['http://192.168.1.42:8000/#t=AB12CD','x','https://example.com/room?code=WONDER42','1234567890123456789012345678901234567890'];
 return samples.map(text=>{
  try{
   const {size,modules}=qrEncode(text);
   // read format info copy 1
   let format=0;const read=(bit,r,c)=>{if(r<0||c<0||r>=size||c>=size)return;format|=(modules[r][c]?1:0)<<bit};
   for(let i=0;i<=5;i++)read(i,8,i);read(6,8,7);read(7,8,8);read(8,7,8);for(let i=9;i<=14;i++)read(i,14-i,8);
   format^=0x5412;const mask=(format>>>10)&7;
   // rebuild the reserved map
   const reserved=[];for(let i=0;i<size;i++)reserved.push(new Array(size).fill(false));
   const mark=(r,c)=>{if(r>=0&&c>=0&&r<size&&c<size)reserved[r][c]=true};
   for(let i=0;i<size;i++){mark(6,i);mark(i,6)}
   [[0,0],[0,size-7],[size-7,0]].forEach(([r,c])=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++)mark(r+dr,c+dc)});
   const L=QR_LEVELS[(size-17)/4];
   L.align.forEach(a=>L.align.forEach(b=>{const near=(a<=8&&b<=8)||(a<=8&&b>=size-9)||(a>=size-9&&b<=8);if(near)return;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)mark(a+dr,b+dc)}));
   mark(size-8,8);
   for(let i=0;i<=5;i++)mark(8,i);mark(8,7);mark(8,8);mark(7,8);for(let i=9;i<=14;i++)mark(14-i,8);
   for(let i=0;i<=6;i++)mark(size-1-i,8);for(let i=7;i<=14;i++)mark(8,size-15+i);
   // unmask + read
   const bits=[];
   for(let col=size-1;col>0;col-=2){if(col===6)col=5;for(let i=0;i<size;i++){const r=(Math.floor((size-1-col)/2)%2===0)?size-1-i:i;for(let k=0;k<2;k++){const c=col-k;if(reserved[r][c])continue;let v=modules[r][c];switch(mask){case 0:v^=(r+c)%2===0?1:0;break;case 1:v^=r%2===0?1:0;break;case 2:v^=c%3===0?1:0;break;case 3:v^=(r+c)%3===0?1:0;break;case 4:v^=(Math.floor(r/2)+Math.floor(c/3))%2===0?1:0;break;case 5:v^=((r*c)%2+(r*c)%3===0)?1:0;break;case 6:v^=(((r*c)%2+(r*c)%3)%2===0)?1:0;break;default:v^=(((r*c)%3+(r+c)%2)%2===0)?1:0}bits.push(v)}}}
   const cw=[];for(let i=0;i+8<=bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];cw.push(b)}
   const gen=qrGenerator(L.ecc),synd=qrRemainder(cw,gen);
   const okSynd=synd.every(v=>v===0);
   const mode=(bits[0]<<3)|(bits[1]<<2)|(bits[2]<<1)|bits[3];
   const len=bits.slice(4,12).reduce((a,b)=>(a<<1)|b,0);
   let out='';for(let i=0;i<len;i++){const byte=bits.slice(12+i*8,20+i*8).reduce((a,b)=>(a<<1)|b,0);out+=String.fromCharCode(byte)}
   return {text,ok:okSynd&&mode===4&&out===text,mask,len};
  }catch(e){return {text,ok:false,error:e.message}}
 });
}
// Database: 140 questions, each fully translated into three languages.
// Compact rows: subject, grade, then question / answer / fact for RU, KK and EN.

  const board=$('#clientBoard');board.replaceChildren();
  (s.board||[]).forEach(word=>{const g=document.createElement('div');g.className='word-group';word.forEach(c=>{const tile=document.createElement('span');tile.className='tile'+(c?' open':'');tile.textContent=c||'';g.append(tile)});board.append(g)});
  const myIndex=typeof s.you==='number'?s.you:-1;
  const myTurn=!s.finished&&!s.spinning&&s.active===myIndex&&myIndex>=0;
  $('#clientTurn').textContent=s.finished?(s.answer||''):s.spinning?wt('spinning'):myTurn?t('yourTurn'):t('notYourTurn');
  $('#clientSpin').classList.toggle('hidden',!myTurn||s.stake!==null);
  $('#clientSpin').disabled=!myTurn||s.stake!==null||s.spinning;
  $('#clientWord').classList.toggle('hidden',!myTurn||s.stake===null);
  $('#clientWord').disabled=!myTurn||s.stake===null;
  const alpha=alphabets[lang];const al=$('#clientAlphabet');al.replaceChildren();
  [...alpha].forEach(c=>{const b=document.createElement('button');b.className='letter';b.textContent=c;b.disabled=!myTurn||s.stake===null||s.spinning||s.finished;b.onclick=()=>{if(b.disabled)return;this.send({t:'letter',c});this.clientStatus(t('letterSent'))};al.append(b)});
  const sc=$('#clientScores');sc.replaceChildren();
  s.players.forEach((p,i)=>{const row=document.createElement('div');row.className='party-player'+(i===s.active?' active':'');const n=document.createElement('b');n.textContent=p.name;const v=document.createElement('span');v.textContent=p.score;row.append(n,v);sc.append(row)});
  if(s.stage==='super'&&s.spins!==null){const sp=document.createElement('div');sp.className='party-player';sp.innerHTML='<small class="sub">'+t('spinsLeft')+': '+s.spins+'</small>';sc.append(sp)}
 }
};
function partyOpen(){Party.open()}
$('#partyStartBtn').onclick=()=>{if(Party.role!=='host')return;players=Party.players;playerCount=players.length;startRound()};
$('#partyStopBtn').onclick=()=>Party.stop();
$('#partyCopy').onclick=async()=>{try{await navigator.clipboard.writeText(partyURL(Party.code));toast(t('copied'))}catch{toast(t('importFail'))}};
$$('input[name=ptrans]').forEach(r=>r.onchange=async()=>{Party.transport=r.value;if(Party.role==='host'){Party.hostStatus(t('connecting'));await Party.connect();Party.renderHost()}});
$('#clientJoin').onclick=()=>{Party.hello();$('#clientStatus').textContent=t('connecting')};
$('#clientSpin').onclick=()=>Party.send({t:'spin'});
$('#clientWord').onclick=()=>{const w=prompt(t('answerTitle'),'');if(w)Party.send({t:'word',w})};
$('#clientLeave').onclick=()=>{Party.send({t:'bye'});Party.disconnect();Party.active=false;Party.role=null;show('home')};
window.addEventListener('beforeunload',()=>{if(Party.active)Party.send({t:'bye'})});
const hashRoom=(location.hash.match(/[#&]t=([A-Z0-9]{4,8})/)||[])[1];
if(hashRoom)Party.join(hashRoom,'');

translate();

</script></body></html>
